name: Static Analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  PHPStan:
    # Same-repo PRs are already covered by the push run; only run PR events for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        include:
          # Laravel 11.*
          - php: 8.2
            laravel: 11.*
            testbench: 9.*
            composer-flag: '--prefer-stable'
          - php: 8.3
            laravel: 11.*
            testbench: 9.*
            composer-flag: '--prefer-stable'
          - php: 8.4
            laravel: 11.*
            testbench: 9.*
            composer-flag: '--prefer-stable'
          # Laravel 12.*
          - php: 8.2
            laravel: 12.*
            testbench: 10.*
            composer-flag: '--prefer-stable'
          - php: 8.3
            laravel: 12.*
            testbench: 10.*
            composer-flag: '--prefer-stable'
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            composer-flag: '--prefer-stable'
          - php: 8.2
            laravel: 12.*
            testbench: 10.*
            composer-flag: '--prefer-lowest'
          - php: 8.3
            laravel: 12.*
            testbench: 10.*
            composer-flag: '--prefer-lowest'
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            composer-flag: '--prefer-lowest'
          # Laravel 13.*
          - php: 8.3
            laravel: 13.*
            testbench: 11.*
            composer-flag: '--prefer-stable'
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            composer-flag: '--prefer-stable'
          - php: 8.3
            laravel: 13.*
            testbench: 11.*
            composer-flag: '--prefer-lowest'
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            composer-flag: '--prefer-lowest'
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv
          coverage: none

      - name: "Allow all versions of the tested Laravel releases"
        run: composer config policy.advisories.block false

      - name: "Install dependencies"
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: "Update dependencies"
        run: composer update ${{ matrix.composer-flag }} --prefer-dist --no-interaction

      - name: "Run PhpStan"
        run: composer analyse
